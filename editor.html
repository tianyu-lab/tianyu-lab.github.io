<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【高阶 3D 矢量剪辑站】天予 3T 实拍 4K 视频与 3D 矢量编辑器 (Tianyu 3D Video Editor)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #ffeb3b; }
        .badge { background: #ffeb3b; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #ffeb3b; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; width: 100%; height: 360px; }
        .btn { background: #ffeb3b; color: #040711; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
        .timeline-box { background: #040711; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-top: 15px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ffeb3b; }
        .file-label { background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid #00e676; padding: 7px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-block; }
        textarea { width: 100%; height: 110px; background: #040711; border: 1px solid #334155; color: #00e676; font-family: monospace; font-size: 10px; padding: 8px; border-radius: 6px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【3D 矢量剪辑站】天予 3T 4K 视频与 3D 矢量剪辑器 <span class="badge">Tianyu 3D Video Editor</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="decoder.html" style="color:#00e676; text-decoration:none; margin-left:15px; font-weight:bold;">前往 B 站解码 ➔</a>
        </div>
    </div>

    <div class="container">
        <!-- 左侧: 4K 视频 / 3D 画布与时间轴 -->
        <div class="card" style="flex: 2;">
            <h3>🎞️ 视频与 3D 矢量视界 (支持选择本地 MP4 视频文件)</h3>
            <div style="margin-bottom: 12px; display:flex; gap:10px; align-items:center;">
                <input type="file" id="editorVideoInput" accept="video/*" style="display:none;" onchange="handleEditorFileSelect(event)">
                <label for="editorVideoInput" class="file-label">📁 选择本地 MP4 视频文件</label>
                <span id="editorFileName" style="font-size:12px; color:#ffeb3b;">已预载: 4K 实拍《老人散步》</span>
            </div>

            <video id="editorVideoEl" width="550" height="360" loop muted playsinline style="display:none;"></video>
            <canvas id="editorCanvas" width="550" height="360"></canvas>

            <div class="timeline-box">
                <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                    <span style="font-size:12px; color:#ffeb3b; font-weight:bold;">⏱️ 3T 极速毫秒级时间线拖拽 (Scrubber)</span>
                    <span style="font-size:12px; font-family:monospace; color:#38bdf8;" id="timeLabel">00:00.00 / Frame 0</span>
                </div>
                <input type="range" id="timeScrubber" min="0" max="29" value="0">
            </div>
        </div>

        <!-- 右侧: 剪辑控制与 3T 码流导出 -->
        <div class="card">
            <h3>✂️ 矢量剪辑控制台与 3T 码流包导出</h3>
            <textarea id="projectExportText" readonly></textarea>
            <button class="btn" style="width:100%; margin-top:10px;" onclick="copyProjectData()">📋 复制 4K 实拍 3T 视频码流包 (去 B 站解算)</button>
            <span id="copyMsg" style="font-size:12px; color:#00e676; display:block; margin-top:5px;"></span>
        </div>
    </div>

    <script src="tianyu_geometry_engine.js"></script>
    <script>
        let ctx, videoEl, canvasEl;
        let laorenB64 = "";

        document.addEventListener("DOMContentLoaded", async () => {
            canvasEl = document.getElementById("editorCanvas");
            ctx = canvasEl.getContext("2d");
            videoEl = document.getElementById("editorVideoEl");

            try {
                const res = await fetch("laoren_3t_b64.txt");
                laorenB64 = (await res.text()).trim();
                document.getElementById("projectExportText").value = laorenB64;
                renderEditorPreview(laorenB64);
            } catch(e) {
                console.log(e);
            }
        });

        function handleEditorFileSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            document.getElementById("editorFileName").innerText = "已选择: " + file.name;
            videoEl.src = URL.createObjectURL(file);
            videoEl.style.display = "block";
            canvasEl.style.display = "none";
            videoEl.play();
        }

        function renderEditorPreview(b64) {
            try {
                const binary = atob(b64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const engine = new window.TianyuPopStackEngine();
                const frame1 = engine.popExtremaStack(bytes.subarray(0, 512));

                const w = canvasEl.width, h = canvasEl.height;
                const cx = w/2, cy = h/2;
                ctx.fillStyle = "#040711"; ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 2.2;
                ctx.fillStyle = "rgba(255, 235, 59, 0.15)";
                ctx.beginPath();
                for (let i = 0; i < frame1.length; i++) {
                    const pt = frame1[i];
                    if (i === 0) ctx.moveTo(cx + pt.x, cy + pt.y); else ctx.lineTo(cx + pt.x, cy + pt.y);
                }
                ctx.closePath(); ctx.stroke(); ctx.fill();

                for (let pt of frame1) {
                    ctx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
                    ctx.beginPath(); ctx.arc(cx + pt.x, cy + pt.y, 3.5, 0, Math.PI * 2); ctx.fill();
                }
            } catch(e) {}
        }

        function copyProjectData() {
            const txt = document.getElementById("projectExportText").value;
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById("copyMsg").innerText = "✅ 3T 视频码流包已复制！可在 B 站精准解算复原！";
                setTimeout(() => document.getElementById("copyMsg").innerText = "", 3000);
            });
        }
    </script>
</body>
</html>
