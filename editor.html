<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【高阶矢量剪辑站】天予 3T 极速矢量视频编辑器 (Tianyu 3T Video Editor)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #ffeb3b; }
        .badge { background: #ffeb3b; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #ffeb3b; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; width: 100%; height: 360px; cursor: crosshair; }
        .btn { background: #ffeb3b; color: #040711; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
        .btn-alt { background: #0284c7; color: #fff; }
        .timeline-box { background: #040711; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-top: 15px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ffeb3b; }
        .tools-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .tool-btn { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .tool-btn.active { border-color: #ffeb3b; color: #ffeb3b; background: rgba(255, 235, 59, 0.1); }
        .flag-btn { cursor: pointer; font-size: 20px; background: none; border: none; margin-left: 10px; }
        .hud-overlay { font-family: monospace; font-size: 11px; color: #00e676; margin-top: 8px; background: rgba(4,7,17,0.7); padding: 6px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【高阶矢量剪辑站】天予 3T 多帧矢量视频编辑器 <span class="badge">Tianyu 3T Pro Video Editor</span></div>
        <div>
            <button class="flag-btn" onclick="setLang('zh')" title="中文">🇨🇳</button>
            <button class="flag-btn" onclick="setLang('en')" title="English">🇺🇸</button>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;" id="navHome">返回主页</a>
            <a href="decoder.html" style="color:#00e676; text-decoration:none; margin-left:15px; font-weight:bold;" id="navGoB">前往 B 站解码 ➔</a>
        </div>
    </div>

    <div class="container">
        <!-- 左侧: 复杂多层矢量画布与时间线轴 -->
        <div class="card" style="flex: 2;">
            <h3 id="txtCanvasTitle">🎞️ 真实多帧矢量视频视界 (高精解剖/物理场极值 毫秒级拖拽)</h3>
            <canvas id="editorCanvas" width="550" height="360"></canvas>
            
            <div class="hud-overlay" id="hudStatus">
                [Pop-Stack 视频编码器]: 30 帧连续多帧压栈 | [视频分辨率]: 100% 无限矢量无损 | [FPS]: 30 FPS
            </div>

            <!-- 时间线拖拽轴 -->
            <div class="timeline-box">
                <div style="display:flex; justify-space-between; margin-bottom: 8px;">
                    <span style="font-size:12px; color:#ffeb3b; font-weight:bold;" id="txtTimelineTitle">⏱️ 3T 极速毫秒级时间线拖拽 (Scrubber)</span>
                    <span style="font-size:12px; font-family:monospace; color:#38bdf8;" id="timeLabel">00:00.00 / Frame 0</span>
                </div>
                <input type="range" id="timeScrubber" min="0" max="29" value="0">
                
                <div class="tools-grid">
                    <button class="btn" id="btnPlayPause">▶️ 播放 / 暂停</button>
                    <button class="tool-btn active" onclick="setPresetShape('surgical')" id="btnPresetSurgical">🧠 复杂解剖/血管拓扑</button>
                    <button class="tool-btn" onclick="setPresetShape('turbine')" id="btnPresetTurbine">⚙️ 高精涡轮/物理工程</button>
                    <button class="tool-btn" onclick="resetTransforms()" id="btnReset">↩️ 重置变换</button>
                </div>
            </div>
        </div>

        <!-- 右侧: 剪辑控制与 3T 矢量工程文件导出 -->
        <div class="card">
            <h3 id="txtControlTitle">✂️ 矢量剪辑控制台与工程导出</h3>
            <p style="font-size:12px; color:#94a3b8; margin-bottom: 12px;" id="txtDesc">基于天予 3T 512 字节/帧 复杂极值轨迹 Stack，可导出完整 30 帧连续矢量视频码流：</p>
            
            <div style="margin-bottom: 15px;">
                <label style="font-size:12px; color:#38bdf8; display:block; margin-bottom:5px;" id="lblZoom">🔍 矢量无限放大倍率: <span id="zoomVal">1.0x</span></label>
                <input type="range" id="zoomSlider" min="50" max="400" value="100">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size:12px; color:#00e676; display:block; margin-bottom:5px;" id="lblRotation">🔄 轨迹动态旋转角度: <span id="rotVal">0°</span></label>
                <input type="range" id="rotSlider" min="0" max="360" value="0">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size:12px; color:#ffeb3b; display:block; margin-bottom:5px;" id="lblHue">🎨 矢量色系渲染:</label>
                <button class="tool-btn" onclick="setTintColor('#00e676')">💚 解剖绿</button>
                <button class="tool-btn" onclick="setTintColor('#38bdf8')">💙 物理蓝</button>
                <button class="tool-btn" onclick="setTintColor('#ff0055')">❤️ 血管红</button>
            </div>

            <textarea id="projectExportText" readonly style="width:100%; height:90px; background:#040711; border:1px solid #334155; color:#00e676; font-family:monospace; font-size:11px; padding:8px; border-radius:6px;" placeholder="多帧 3T 视频码流生成中..."></textarea>
            
            <button class="btn" style="width:100%; margin-top:10px;" onclick="copyProjectData()" id="btnExport">📋 导出 30帧 3T 矢量视频工程码流 (复制到 B 站解码播放)</button>
            <span id="copyMsg" style="font-size:12px; color:#00e676; display:block; margin-top:5px;"></span>
        </div>
    </div>

    <script src="tianyu_geometry_engine.js"></script>
    <script>
        let canvas, ctx;
        let isPlaying = false;
        let frameIndex = 0;
        let totalFrames = 30;
        let currentZoom = 1.0;
        let currentRotation = 0;
        let tintColor = "#00e676";
        let presetMode = "surgical";

        document.addEventListener("DOMContentLoaded", () => {
            canvas = document.getElementById("editorCanvas");
            ctx = canvas.getContext("2d");

            document.getElementById("btnPlayPause").addEventListener("click", togglePlay);
            document.getElementById("timeScrubber").addEventListener("input", (e) => {
                frameIndex = parseInt(e.target.value);
                updateFrameDisplay();
            });

            document.getElementById("zoomSlider").addEventListener("input", (e) => {
                currentZoom = parseInt(e.target.value) / 100;
                document.getElementById("zoomVal").innerText = currentZoom.toFixed(1) + "x";
                drawFrame();
            });

            document.getElementById("rotSlider").addEventListener("input", (e) => {
                currentRotation = parseInt(e.target.value);
                document.getElementById("rotVal").innerText = currentRotation + "°";
                drawFrame();
            });

            generateProjectStream();
            startAnimLoop();
        });

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById("btnPlayPause").innerText = isPlaying ? "⏸️ 暂停" : "▶️ 播放";
        }

        function startAnimLoop() {
            function loop() {
                requestAnimationFrame(loop);
                if (isPlaying) {
                    frameIndex = (frameIndex + 1) % totalFrames;
                    document.getElementById("timeScrubber").value = frameIndex;
                    updateFrameDisplay();
                } else {
                    drawFrame();
                }
            }
            loop();
        }

        function updateFrameDisplay() {
            const sec = (frameIndex / 30).toFixed(2);
            document.getElementById("timeLabel").innerText = `00:${sec < 10 ? '0'+sec : sec} / Frame ${frameIndex}`;
            drawFrame();
        }

        function setPresetShape(mode) {
            presetMode = mode;
            drawFrame();
            generateProjectStream();
        }

        function drawFrame() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#040711"; ctx.fillRect(0, 0, w, h);

            const t = frameIndex / 5;
            const cx = w / 2, cy = h / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(currentZoom, currentZoom);
            ctx.rotate((currentRotation * Math.PI) / 180);

            if (presetMode === "surgical") {
                drawComplexSurgicalVessels(ctx, t);
            } else {
                drawComplexTurbineMesh(ctx, t);
            }

            ctx.restore();
        }

        function drawComplexSurgicalVessels(ctx, t) {
            const count = 64;
            ctx.strokeStyle = tintColor; ctx.lineWidth = 2.5 / currentZoom;
            ctx.fillStyle = tintColor + "22";
            ctx.beginPath();
            let pts = [];
            for (let i = 0; i < count; i++) {
                const th = (i / count) * Math.PI * 2;
                const r = 90 + Math.sin(th * 5 + t) * 25 + Math.cos(th * 3 - t*1.5) * 15;
                const x = Math.cos(th) * r;
                const y = Math.sin(th) * r;
                pts.push({ x, y });
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.stroke(); ctx.fill();

            ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 1.8 / currentZoom;
            ctx.beginPath();
            for (let i = 0; i < 32; i++) {
                const th = (i / 32) * Math.PI * 2;
                const r = 45 + Math.sin(th * 7 - t * 2) * 18;
                const x = Math.cos(th) * r; const y = Math.sin(th) * r;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.stroke();

            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < pts.length; i += 2) {
                const pt = pts[i];
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 3 / currentZoom, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawComplexTurbineMesh(ctx, t) {
            const blades = 12;
            ctx.strokeStyle = tintColor; ctx.lineWidth = 2 / currentZoom;
            ctx.fillStyle = tintColor + "1b";

            for (let b = 0; b < blades; b++) {
                const baseTh = (b / blades) * Math.PI * 2 + t * 0.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                const x1 = Math.cos(baseTh) * 40; const y1 = Math.sin(baseTh) * 40;
                const x2 = Math.cos(baseTh + 0.3) * 110; const y2 = Math.sin(baseTh + 0.3) * 110;
                const x3 = Math.cos(baseTh + 0.4) * 80; const y3 = Math.sin(baseTh + 0.4) * 80;
                ctx.bezierCurveTo(x1, y1, x2, y2, x3, y3);
                ctx.closePath(); ctx.stroke(); ctx.fill();
            }

            ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 2 / currentZoom;
            ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
        }

        // 拼接生成 30 帧连续多帧 Pop-Stack 视频 Base64 码流包 (Uint8Array 512 * 30)
        function generateProjectStream() {
            const totalVideoBytes = new Uint8Array(512 * 30);
            for (let f = 0; f < 30; f++) {
                const engine = new window.TianyuPopStackEngine();
                const t = f / 5;
                for (let i = 0; i < 64; i++) {
                    const th = (i / 64) * Math.PI * 2;
                    let r = 90;
                    if (presetMode === "surgical") {
                        r = 90 + Math.sin(th * 5 + t) * 25 + Math.cos(th * 3 - t * 1.5) * 15;
                    } else {
                        r = 85 + Math.sin(th * 12 + t * 2) * 30;
                    }
                    const x = Math.cos(th) * r;
                    const y = Math.sin(th) * r;
                    engine.pushExtremaStack(x, y, f, th, 0, 230, 118);
                }
                const frameBuf = engine.encodeToBuffer512();
                totalVideoBytes.set(frameBuf, f * 512);
            }

            let binary = '';
            for (let i = 0; i < totalVideoBytes.byteLength; i++) binary += String.fromCharCode(totalVideoBytes[i]);
            document.getElementById("projectExportText").value = btoa(binary);
        }

        function resetTransforms() {
            currentZoom = 1.0; currentRotation = 0;
            document.getElementById("zoomSlider").value = 100;
            document.getElementById("rotSlider").value = 0;
            document.getElementById("zoomVal").innerText = "1.0x";
            document.getElementById("rotVal").innerText = "0°";
            tintColor = "#00e676";
            drawFrame();
        }

        function setTintColor(c) {
            tintColor = c;
            drawFrame();
        }

        function copyProjectData() {
            const txt = document.getElementById("projectExportText").value;
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById("copyMsg").innerText = "✅ 30帧 3T 矢量视频码流已复制！在 B 站可真实播放该视频！";
                setTimeout(() => document.getElementById("copyMsg").innerText = "", 3000);
            });
        }

        function setLang(lang) {
            if (lang === 'en') {
                document.getElementById("navHome").innerText = "Home";
                document.getElementById("navGoB").innerText = "Go to Decoder B ➔";
                document.getElementById("txtCanvasTitle").innerText = "🎞️ Complex Multi-Frame Vector Video Preview";
                document.getElementById("btnPresetSurgical").innerText = "🧠 Complex Anatomical Vessel";
                document.getElementById("btnPresetTurbine").innerText = "⚙️ Precision Turbine Mesh";
                document.getElementById("txtTimelineTitle").innerText = "⏱️ 3T Ultra-Fast Scrubber Timeline";
                document.getElementById("btnPlayPause").innerText = isPlaying ? "⏸️ Pause" : "▶️ Play";
                document.getElementById("txtControlTitle").innerText = "✂️ Pro Vector Video Console & Export";
                document.getElementById("btnExport").innerText = "📋 Export 30-Frame 3T Video Stream";
            } else {
                document.getElementById("navHome").innerText = "返回主页";
                document.getElementById("navGoB").innerText = "前往 B 站解码 ➔";
                document.getElementById("txtCanvasTitle").innerText = "🎞️ 真实多帧矢量视频视界 (高精解剖/物理场极值 毫秒级拖拽)";
                document.getElementById("btnPresetSurgical").innerText = "🧠 复杂解剖/血管拓扑";
                document.getElementById("btnPresetTurbine").innerText = "⚙️ 高精涡轮/物理工程";
                document.getElementById("txtTimelineTitle").innerText = "⏱️ 3T 极速毫秒级时间线拖拽 (Scrubber)";
                document.getElementById("btnPlayPause").innerText = "▶️ 播放 / 暂停";
                document.getElementById("txtControlTitle").innerText = "✂️ 矢量剪辑控制台与工程导出";
                document.getElementById("btnExport").innerText = "📋 导出 30帧 3T 矢量视频工程码流 (复制到 B 站解码播放)";
            }
        }
    </script>
</body>
</html>
