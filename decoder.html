<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【纯粹 Pop-Stack 解码器】原视频 256 帧 Pop-Stack 弹栈解算工作站 (Decoder Station B)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #00e676; }
        .badge { background: #00e676; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #00e676; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; width: 450px; height: 340px; display: block; margin: 0 auto; }
        .btn-decode { background: linear-gradient(135deg, #00e676 0%, #0284c7 100%); color: #040711; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: transform 0.2s; }
        .btn-decode:hover { transform: scale(1.02); }
        .btn-clear { background: #ef4444; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-clear:hover { background: #dc2626; }
        textarea { width: 100%; height: 180px; background: #040711; border: 1px solid #334155; color: #00d2ff; font-family: monospace; padding: 10px; border-radius: 6px; font-size: 10px; margin-bottom: 12px; word-break: break-all; spellcheck: false; }
        .status-badge { background: rgba(0, 230, 118, 0.2); border: 1px solid #00e676; color: #00e676; font-family: monospace; font-size: 12px; padding: 6px 12px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【B站 · 纯 Pop-Stack 解码器】Pop-Stack 轨迹 Stack 弹栈解算工作站 <span class="badge">Pure Pop-Stack</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="encoder.html" style="color:#38bdf8; text-decoration:none; margin-left:15px;">⬅️ 返回 A 站编码器</a>
        </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0;">📥 第一步：粘贴 A 站纯 Pop-Stack 码流 (支持一键清空)</h3>
            <button class="btn-clear" onclick="clearStreamText()">🗑️ 清空窗口内容 (Clear Text)</button>
        </div>
        
        <textarea id="streamInputText" placeholder="在此粘贴从 A 站复制的纯 Pop-Stack Base64 码流..."></textarea>
        
        <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
            <button class="btn-decode" onclick="decodePurePopStackStream()" id="btnDecode">⚡ 运行 Pop-Stack 物理弹栈解算 (Run Pop-Stack)</button>
            <span id="decodeStatus" class="status-badge">等待粘贴纯 Pop-Stack 码流...</span>
        </div>
    </div>

    <div class="card">
        <h3>🏆 第二步：Pop-Stack 轨迹 Stack 弹栈复原 Player 画幅 (不动极值处理)</h3>
        <canvas id="reconstructedCanvas" width="450" height="340"></canvas>
        <p style="font-size:12px; color:#94a3b8; text-align:center; margin-top:10px;">纯粹运行 Pop-Stack 弹栈算法，0 显存依赖 100% 弹栈复原 256 页画面！</p>
    </div>

    <script>
        let reconCtx;
        let popStackFrames = [];
        let currentFrameIndex = 0;
        let isDecoded = false;
        let lastFrameTime = 0;

        document.addEventListener("DOMContentLoaded", () => {
            reconCtx = document.getElementById("reconstructedCanvas").getContext("2d");
            renderLoop();
        });

        function clearStreamText() {
            document.getElementById("streamInputText").value = "";
            popStackFrames = [];
            isDecoded = false;
            currentFrameIndex = 0;
            reconCtx.fillStyle = "#040711";
            reconCtx.fillRect(0, 0, 450, 340);
            document.getElementById("decodeStatus").innerText = "🗑️ 窗口内容与解算画面已成功清空！";
            document.getElementById("decodeStatus").style.color = "#ef4444";
        }

        // 纯粹 Pop-Stack 弹栈解码器 (Pop-Stack 弹栈算法)
        function decodePurePopStackStream() {
            const txt = document.getElementById("streamInputText").value.replace(/\s+/g, '');
            if (!txt) {
                alert("⚠️ 请先粘贴纯 Pop-Stack Base64 码流！");
                return;
            }

            try {
                const binary = atob(txt);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                popStackFrames = [];
                let p = 0;
                while (p < bytes.length) {
                    if (bytes[p] !== 0x54) { p++; continue; } // 匹配包头 0x54 ('T')
                    
                    const frameNum = (bytes[p + 1] << 8) | bytes[p + 2];
                    const count = (bytes[p + 3] << 8) | bytes[p + 4];
                    
                    // Pop-Stack 弹栈核心：按需从 Stack 弹出轨迹点 (x, y, z_t, r, g, b)
                    const frameStack = [];
                    let idx = p + 5;
                    for (let i = 0; i < count && idx + 6 <= bytes.length; i++) {
                        frameStack.push({
                            x: bytes[idx] - 128,
                            y: bytes[idx + 1] - 128,
                            z_t: bytes[idx + 2] - 128,
                            r: bytes[idx + 3],
                            g: bytes[idx + 4],
                            b: bytes[idx + 5]
                        });
                        idx += 6;
                    }

                    if (frameStack.length > 0) popStackFrames.push(frameStack);
                    p = idx;
                }

                if (popStackFrames.length > 0) {
                    isDecoded = true;
                    currentFrameIndex = 0;
                    const kbSize = (bytes.length / 1024).toFixed(1);
                    document.getElementById("decodeStatus").innerText = `✅ Pop-Stack 弹栈成功！成功弹栈 ${popStackFrames.length} 页轨迹 Stack (${kbSize} KB)，播放中！`;
                    document.getElementById("decodeStatus").style.color = "#00e676";
                } else {
                    document.getElementById("decodeStatus").innerText = "⚠️ 未解析到有效 Pop-Stack 帧，请检查码流";
                }
            } catch(e) {
                document.getElementById("decodeStatus").innerText = "❌ 弹栈解算报错: " + e.message;
            }
        }

        function renderLoop(timestamp) {
            function loop(now) {
                requestAnimationFrame(loop);
                if (isDecoded && popStackFrames.length > 0) {
                    if (now - lastFrameTime > 40) { // 25 FPS 播放
                        currentFrameIndex = (currentFrameIndex + 1) % popStackFrames.length;
                        lastFrameTime = now;
                    }
                }
                renderPopStackPlayer(reconCtx);
            }
            loop(timestamp || 0);
        }

        // Pop-Stack 弹栈 Player：0 显存依赖，纯粹通过 Pop Stack 复原画面
        function renderPopStackPlayer(ctx) {
            const w = ctx.canvas.width, h = ctx.canvas.height;
            ctx.fillStyle = "#040711"; ctx.fillRect(0, 0, w, h);

            if (!isDecoded || popStackFrames.length === 0) return;
            const pts = popStackFrames[currentFrameIndex];
            if (!pts || pts.length === 0) return;

            const scaleX = w / 256;
            const scaleY = h / 256;

            // 从 Pop-Stack 弹出的元素复原实拍 RGB 画面
            for (let pt of pts) {
                const px = (pt.x + 128) * scaleX;
                const py = (pt.y + 128) * scaleY;
                ctx.fillStyle = `rgb(${pt.r}, ${pt.g}, ${pt.b})`;
                ctx.fillRect(px, py, 16 * scaleX, 16 * scaleY);
            }
        }
    </script>
</body>
</html>
