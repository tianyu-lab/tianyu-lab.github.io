<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【B站 · 真实宽高比 Decoder】天予 3T 25 帧/秒 原视频宽高比 Decoder 工作站</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #00e676; }
        .badge { background: #00e676; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #00e676; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; max-width: 100%; display: block; margin: 0 auto; }
        .btn-decode { background: linear-gradient(135deg, #00e676 0%, #0284c7 100%); color: #040711; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: transform 0.2s; }
        .btn-decode:hover { transform: scale(1.02); }
        .btn-clear { background: #ef4444; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-clear:hover { background: #dc2626; }
        textarea { width: 100%; height: 180px; background: #040711; border: 1px solid #334155; color: #00d2ff; font-family: monospace; padding: 10px; border-radius: 6px; font-size: 10px; margin-bottom: 12px; word-break: break-all; spellcheck: false; }
        .status-badge { background: rgba(0, 230, 118, 0.2); border: 1px solid #00e676; color: #00e676; font-family: monospace; font-size: 12px; padding: 6px 12px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【B站 · 真实宽高比 Decoder】25 帧/秒 原视频宽高比 Pop-Stack 解算工作站 <span class="badge">Station B (Aspect Sync)</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="encoder.html" style="color:#38bdf8; text-decoration:none; margin-left:15px;">⬅️ 返回 A 站编码器</a>
        </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0;">📥 第一步：粘贴 A 站真实宽高比 Coder 码流 (支持一键清空)</h3>
            <button class="btn-clear" onclick="clearStreamText()">🗑️ 清空窗口内容 (Clear Text)</button>
        </div>
        
        <textarea id="streamInputText" placeholder="在此粘贴从 A 站复制的真实宽高比 Coder 码流..."></textarea>
        
        <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
            <button class="btn-decode" onclick="decodeAspectStream()" id="btnDecode">⚡ 运行原图宽高比解算 (Run Aspect Decoder)</button>
            <span id="decodeStatus" class="status-badge">等待粘贴真实宽高比例码流...</span>
        </div>
    </div>

    <div class="card">
        <h3>🏆 第二步：原视频真实宽高比例复原 Player 画幅 (零长方块变形失真)</h3>
        <canvas id="reconstructedCanvas" width="320" height="240"></canvas>
        <p style="font-size:12px; color:#94a3b8; text-align:center; margin-top:10px;">物理 1:1 动态还原原视频的 4:3 / 16:9 真实比例，彻底告别长方块拉伸！</p>
    </div>

    <script>
        let reconCanvas, reconCtx;
        let videoFrames = [];
        let currentFrameIndex = 0;
        let isDecoded = false;
        let lastFrameTime = 0;

        document.addEventListener("DOMContentLoaded", () => {
            reconCanvas = document.getElementById("reconstructedCanvas");
            reconCtx = reconCanvas.getContext("2d");
            renderLoop();
        });

        function clearStreamText() {
            document.getElementById("streamInputText").value = "";
            videoFrames = [];
            isDecoded = false;
            currentFrameIndex = 0;
            reconCtx.fillStyle = "#040711";
            reconCtx.fillRect(0, 0, reconCanvas.width, reconCanvas.height);
            document.getElementById("decodeStatus").innerText = "🗑️ 窗口内容与解算画面已成功清空！";
            document.getElementById("decodeStatus").style.color = "#ef4444";
        }

        // 智能自适应视频真实宽高比的 Pop-Stack Decoder
        function decodeAspectStream() {
            const txt = document.getElementById("streamInputText").value.replace(/\s+/g, '');
            if (!txt) {
                alert("⚠️ 请先粘贴 25 FPS Coder 码流！");
                return;
            }

            try {
                const binary = atob(txt);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                videoFrames = [];
                let p = 0;
                let targetW = 320, targetH = 240;

                while (p < bytes.length) {
                    if (bytes[p] !== 0x54) { p++; continue; }
                    
                    if (bytes[p + 1] === 0x25) {
                        targetW = (bytes[p + 2] << 8) | bytes[p + 3];
                        targetH = (bytes[p + 4] << 8) | bytes[p + 5];
                        const count = (bytes[p + 6] << 16) | (bytes[p + 7] << 8) | bytes[p + 8];
                        
                        // 动态调整 Canvas 为原视频真实比例
                        reconCanvas.width = targetW;
                        reconCanvas.height = targetH;

                        const imgData = reconCtx.createImageData(targetW, targetH);
                        const data = imgData.data;
                        let idx = p + 9;

                        for (let i = 0; i < count && idx + 7 <= bytes.length; i++) {
                            const px = (bytes[idx] << 8) | bytes[idx + 1];
                            const py = (bytes[idx + 2] << 8) | bytes[idx + 3];
                            const r = bytes[idx + 4];
                            const g = bytes[idx + 5];
                            const b = bytes[idx + 6];

                            if (px < targetW && py < targetH) {
                                const pixelIdx = (py * targetW + px) * 4;
                                data[pixelIdx] = r;
                                data[pixelIdx + 1] = g;
                                data[pixelIdx + 2] = b;
                                data[pixelIdx + 3] = 255;
                            }
                            idx += 7;
                        }
                        videoFrames.push(imgData);
                        p = idx;
                    } else {
                        p++;
                    }
                }

                if (videoFrames.length > 0) {
                    isDecoded = true;
                    currentFrameIndex = 0;
                    const mbSize = (bytes.length / (1024 * 1024)).toFixed(2);
                    document.getElementById("decodeStatus").innerText = `✅ 精确解算成功！自动识别原视频真实比例 (${targetW}x${targetH})，解算 ${videoFrames.length} 帧全彩画面 (${mbSize} MB)，25 FPS 播放中！`;
                    document.getElementById("decodeStatus").style.color = "#00e676";
                } else {
                    document.getElementById("decodeStatus").innerText = "⚠️ 未解析到有效真实比例帧，请检查码流";
                }
            } catch(e) {
                document.getElementById("decodeStatus").innerText = "❌ 解算报错: " + e.message;
            }
        }

        function renderLoop(timestamp) {
            function loop(now) {
                requestAnimationFrame(loop);
                if (isDecoded && videoFrames.length > 0) {
                    if (now - lastFrameTime > 40) { // 25 FPS
                        currentFrameIndex = (currentFrameIndex + 1) % videoFrames.length;
                        lastFrameTime = now;
                    }
                }
                renderPhotorealAspectPlayer(reconCtx);
            }
            loop(timestamp || 0);
        }

        function renderPhotorealAspectPlayer(ctx) {
            if (!isDecoded || videoFrames.length === 0) return;
            const imgData = videoFrames[currentFrameIndex];
            if (imgData) {
                ctx.putImageData(imgData, 0, 0);
            }
        }
    </script>
</body>
</html>
