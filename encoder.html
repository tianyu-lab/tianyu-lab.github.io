        document.addEventListener("DOMContentLoaded", () => {
            ctx = document.getElementById("encoderCanvas").getContext("2d");

            // 初始化解算实拍 4K 视频码流
            const binary1 = atob(laorenB64);
            const bytes1 = new Uint8Array(binary1.length);
            for (let i = 0; i < binary1.length; i++) bytes1[i] = binary1.charCodeAt(i);
            const engine = new window.TianyuPopStackEngine();
            
            laorenVideoFrames = [];
            for (let f = 0; f < 30; f++) {
                const frameBytes = bytes1.subarray(f * 512, (f + 1) * 512);
                laorenVideoFrames.push(engine.popExtremaStack(frameBytes));
            }

            // 解算 3D Mesh 预设码流
            const binary2 = atob(mesh3DB64);
            const bytes2 = new Uint8Array(binary2.length);
            for (let i = 0; i < binary2.length; i++) bytes2[i] = binary2.charCodeAt(i);
            mesh3DPts = engine.popExtremaStack(bytes2);

            document.getElementById("streamOutputText").value = laorenB64;
            startAnimLoop();
        });

        function switchPreset(p) {
            activePreset = p;
            document.getElementById("btnLaoren").className = "tool-btn" + (p === 'laoren' ? ' active' : '');
            document.getElementById("btn3DMesh").className = "tool-btn" + (p === '3dmesh' ? ' active' : '');
            
            if (p === 'laoren') {
                document.getElementById("streamOutputText").value = laorenB64;
                document.getElementById("txtCanvasTitle").innerText = "🎞️ 4K 实拍视频《老人散步》与 3D 矢量原图视界";
            } else {
                document.getElementById("streamOutputText").value = mesh3DB64;
                document.getElementById("txtCanvasTitle").innerText = "🧊 酷炫 3D 空间立体向量视界 (3D 空间自转)";
            }
        }

        function startAnimLoop() {
            function loop(now) {
                requestAnimationFrame(loop);
                rotY += 0.02;
                if (now - lastTime > 33) {
                    frameIndex = (frameIndex + 1) % 30;
                    lastTime = now;
                }
                drawCanvasFrame();
            }
            loop(0);
        }

        // 渲染 Canvas 视频与 3D 向量画幅 (支持双模式秒级无缝切换)
        function drawCanvasFrame() {
            const w = ctx.canvas.width, h = ctx.canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#040711"; ctx.fillRect(0, 0, w, h);

            const cx = w / 2, cy = h / 2;

            if (activePreset === 'laoren' && laorenVideoFrames.length > 0) {
                // 实拍 4K 视频
                const extrema = laorenVideoFrames[frameIndex];
                if (!extrema || extrema.length < 3) return;

                ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.2;
                ctx.fillStyle = "rgba(56, 189, 248, 0.15)";
                ctx.beginPath();
                for (let i = 0; i < extrema.length; i++) {
                    const pt = extrema[i];
                    const px = cx + pt.x;
                    const py = cy + pt.y;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.stroke(); ctx.fill();

                for (let i = 0; i < extrema.length; i++) {
                    const pt = extrema[i];
                    ctx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
                    ctx.beginPath();
                    ctx.arc(cx + pt.x, cy + pt.y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (activePreset === '3dmesh' && mesh3DPts.length > 0) {
                // 酷炫 3D 空间立体向量
                function project3D(x, y, z) {
                    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                    const cosX = Math.cos(0.35), sinX = Math.sin(0.35);

                    const x1 = x * cosY - z * sinY;
                    const z1 = x * sinY + z * cosY;

                    const y2 = y * cosX - z1 * sinX;
                    const z2 = y * sinX + z1 * cosX;

                    const scale = 280 / (280 + z2);
                    return { px: cx + x1 * scale, py: cy + y2 * scale, scale: scale, z: z2 };
                }

                ctx.strokeStyle = "#00e676"; ctx.lineWidth = 2.5;
                ctx.fillStyle = "rgba(0, 230, 118, 0.18)";
                ctx.beginPath();

                let projectedPts = [];
                for (let i = 0; i < mesh3DPts.length; i++) {
                    const pt = mesh3DPts[i];
                    const z = Math.sin(i * 0.4 + rotY) * 45;
                    const proj = project3D(pt.x, pt.y, z);
                    projectedPts.push(proj);
                    if (i === 0) ctx.moveTo(proj.px, proj.py); else ctx.lineTo(proj.px, proj.py);
                }
                ctx.closePath(); ctx.stroke(); ctx.fill();

                for (let proj of projectedPts) {
                    ctx.fillStyle = proj.z > 0 ? "#ffffff" : "#ffeb3b";
                    ctx.beginPath();
                    ctx.arc(proj.px, proj.py, 3.5 * proj.scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
