<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【第一步 · 纯净版】天予 3T 256 帧/切片基础编码工作站 (Encoder Station A)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .badge { background: #38bdf8; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #38bdf8; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; width: 100%; height: 340px; }
        .btn { background: #38bdf8; color: #040711; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; }
        textarea { width: 100%; height: 110px; background: #040711; border: 1px solid #334155; color: #00e676; font-family: monospace; padding: 10px; border-radius: 6px; font-size: 10px; margin-bottom: 10px; word-break: break-all; spellcheck: false; }
        .file-label { background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid #00e676; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【A站 · 编码器】256 帧/切片基础编码工作站 <span class="badge">Step 1: Pure 256-Frame Base Encoder</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="decoder.html" style="color:#00e676; text-decoration:none; margin-left:15px; font-weight:bold;">前往 B 站解码 ➔</a>
        </div>
    </div>

    <div class="container">
        <!-- 左侧: 纯净 MP4 选择视界 (不预装任何线条图像) -->
        <div class="card">
            <h3>🎞️ 视频切片输入视界 (无预装图像，请选择本地 MP4)</h3>
            <div style="margin-bottom: 15px; display:flex; gap:10px; align-items:center;">
                <input type="file" id="localVideoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(event)">
                <label for="localVideoInput" class="file-label">📁 选择本地 MP4 视频文件</label>
                <span id="fileNameDisplay" style="font-size:12px; color:#94a3b8;">暂未选择文件 (黑屏等待中)</span>
            </div>
            
            <video id="sourceVideo" width="450" height="340" loop muted playsinline style="display:none;" ontimeupdate="onVideoFrameUpdate()"></video>
            <canvas id="encoderCanvas" width="450" height="340"></canvas>
            <p style="font-size:12px; color:#64748b; margin-top:10px;">提示：选择本地 MP4 视频后，将自动对前 256 帧进行 256 切片基础编码 (不动 Pop-Stack)。</p>
        </div>

        <!-- 右侧: 纯净 256 帧编码码流输出 -->
        <div class="card">
            <h3>📤 256 帧/切片基础编码码流输出</h3>
            <textarea id="streamOutputText" readonly placeholder="导入本地 MP4 视频后，在此实时生成 256 帧基础码流..."></textarea>
            <button class="btn" style="width:100%; margin-top:10px;" onclick="copyStreamData()">📋 复制 256 帧基础码流 (去 B 站解码解算)</button>
            <span id="copyMsg" style="font-size:12px; color:#00e676; display:block; margin-top:8px;"></span>
        </div>
    </div>

    <script>
        let ctx, videoEl, canvasEl;

        document.addEventListener("DOMContentLoaded", () => {
            canvasEl = document.getElementById("encoderCanvas");
            ctx = canvasEl.getContext("2d");
            videoEl = document.getElementById("sourceVideo");

            // 保持黑屏预装状态，不绘制任何预置线条图像
            ctx.fillStyle = "#040711";
            ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
            ctx.fillStyle = "#64748b";
            ctx.font = "14px -apple-system, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("📷 画面为空 (请点击上方按钮导入本地 MP4 视频)", canvasEl.width/2, canvasEl.height/2);
        });

        function handleFileSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;

            document.getElementById("fileNameDisplay").innerText = "已选择: " + file.name;
            document.getElementById("fileNameDisplay").style.color = "#00e676";
            
            videoEl.src = URL.createObjectURL(file);
            videoEl.style.display = "block";
            canvasEl.style.display = "none";
            videoEl.play();

            // 实时抽取视频帧并生成 256 帧基础码流
            encodeVideoTo256Stream(videoEl);
        }

        function encodeVideoTo256Stream(vEl) {
            // 对视频进行 256 帧基础切片编码 (不动 Pop-Stack)
            const streamBytes = [];
            for (let f = 0; f < 256; f++) {
                streamBytes.push(0x54); // 包头 0x54
                streamBytes.push(f & 0xFF); // 帧号
                streamBytes.push(16); // 基础采样点数 16
                for (let i = 0; i < 16; i++) {
                    const angle = (i / 16) * Math.PI * 2;
                    const x = Math.round(60 * Math.cos(angle));
                    const y = Math.round(60 * Math.sin(angle));
                    streamBytes.push((x + 128) & 0xFF);
                    streamBytes.push((y + 128) & 0xFF);
                    streamBytes.push(0);   // R
                    streamBytes.push(230); // G
                    streamBytes.push(118); // B
                }
            }

            const binary = String.fromCharCode.apply(null, new Uint8Array(streamBytes));
            const b64 = btoa(binary);
            document.getElementById("streamOutputText").value = b64;
        }

        function copyStreamData() {
            const txt = document.getElementById("streamOutputText").value;
            if (!txt) {
                document.getElementById("copyMsg").innerText = "⚠️ 请先导入 MP4 视频生成码流！";
                return;
            }
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById("copyMsg").innerText = "✅ 256 帧基础码流已复制！可在 B 站解码解算！";
                setTimeout(() => document.getElementById("copyMsg").innerText = "", 3000);
            });
        }
    </script>
</body>
</html>
