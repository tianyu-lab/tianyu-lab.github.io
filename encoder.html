<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【第一步】天予 3T 256 帧/切片基础编码工作站 (Step 1 Base 256-Frame Codec)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .badge { background: #38bdf8; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #38bdf8; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; width: 100%; height: 340px; }
        .btn { background: #38bdf8; color: #040711; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; }
        textarea { width: 100%; height: 110px; background: #040711; border: 1px solid #334155; color: #00e676; font-family: monospace; padding: 10px; border-radius: 6px; font-size: 10px; margin-bottom: 10px; word-break: break-all; spellcheck: false; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【第一步】256 帧/切片基础编码工作站 <span class="badge">Step 1: 256-Frame Base Layer (No Pop-Stack)</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="decoder.html" style="color:#00e676; text-decoration:none; margin-left:15px; font-weight:bold;">前往 B 站解码 ➔</a>
        </div>
    </div>

    <div class="container">
        <!-- 左侧: 256 帧基础画面 -->
        <div class="card">
            <h3>🎞️ 第一步：256 帧切片基础视界 (Pop-Stack 暂不动)</h3>
            <canvas id="step1Canvas" width="450" height="340"></canvas>
            <p style="font-size:12px; color:#94a3b8; margin-top:10px;">保持 Pop-Stack 极值轨迹 Stack 不动，仅编码 256 帧切片基础层。</p>
        </div>

        <!-- 右侧: 256 帧基础码流输出 -->
        <div class="card">
            <h3>📤 256 帧基础层编码码流输出</h3>
            <textarea id="step1StreamText" readonly></textarea>
            <button class="btn" style="width:100%; margin-top:10px;" onclick="copyStep1Data()">📋 复制 256 帧基础码流 (去 B 站解码解算)</button>
            <span id="copyMsg" style="font-size:12px; color:#00e676; display:block; margin-top:8px;"></span>
        </div>
    </div>

    <script>
        let ctx, animId;
        let step1Frames = [];
        let currentFrameIndex = 0;
        let step1B64 = "";

        document.addEventListener("DOMContentLoaded", () => {
            ctx = document.getElementById("step1Canvas").getContext("2d");
            generate256FrameBaseStream();
            startLoop();
        });

        // 第一步：只生成与编码 256 帧基础层 (不动 Pop-Stack)
        function generate256FrameBaseStream() {
            step1Frames = [];
            const streamBytes = [];

            for (let f = 0; f < 256; f++) {
                const pts = [];
                const radius = 50 + 20 * Math.sin(f * 0.05);
                const count = 64;

                streamBytes.push(0x54); // 包头 0x54 ('T')
                streamBytes.push(f & 0xFF); // 帧号
                streamBytes.push(count);

                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = Math.round(radius * Math.cos(angle));
                    const y = Math.round(radius * Math.sin(angle));
                    const r = Math.round(128 + 127 * Math.cos(f * 0.1));
                    const g = Math.round(128 + 127 * Math.sin(f * 0.1 + 2));
                    const b = Math.round(128 + 127 * Math.cos(f * 0.1 + 4));

                    pts.push({ x, y, r, g, b });

                    streamBytes.push((x + 128) & 0xFF);
                    streamBytes.push((y + 128) & 0xFF);
                    streamBytes.push(r);
                    streamBytes.push(g);
                    streamBytes.push(b);
                }
                step1Frames.push(pts);
            }

            const binary = String.fromCharCode.apply(null, new Uint8Array(streamBytes));
            step1B64 = btoa(binary);
            document.getElementById("step1StreamText").value = step1B64;
        }

        function startLoop() {
            let lastTime = 0;
            function loop(now) {
                requestAnimationFrame(loop);
                if (now - lastTime > 33) {
                    currentFrameIndex = (currentFrameIndex + 1) % 256;
                    lastTime = now;
                }
                renderFrame();
            }
            loop(0);
        }

        function renderFrame() {
            const w = ctx.canvas.width, h = ctx.canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#040711"; ctx.fillRect(0, 0, w, h);

            if (step1Frames.length === 0) return;
            const pts = step1Frames[currentFrameIndex];
            const cx = w / 2, cy = h / 2;

            ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.0;
            ctx.beginPath();
            for (let i = 0; i < pts.length; i++) {
                if (i === 0) ctx.moveTo(cx + pts[i].x, cy + pts[i].y); else ctx.lineTo(cx + pts[i].x, cy + pts[i].y);
            }
            ctx.closePath(); ctx.stroke();

            for (let pt of pts) {
                ctx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
                ctx.beginPath(); ctx.arc(cx + pt.x, cy + pt.y, 3.5, 0, Math.PI * 2); ctx.fill();
            }
        }

        function copyStep1Data() {
            const txt = document.getElementById("step1StreamText").value;
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById("copyMsg").innerText = "✅ 第一步 256 帧基础码流已复制！可在 B 站解算复原！";
                setTimeout(() => document.getElementById("copyMsg").innerText = "", 3000);
            });
        }
    </script>
</body>
</html>
