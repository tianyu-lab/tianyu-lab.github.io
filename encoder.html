<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【A站 · 全量 256 页高密原视频编码器】天予 3T 原视频完整 256 页高密编码工作站</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .badge { background: #38bdf8; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #38bdf8; font-size: 16px; margin-bottom: 15px; }
        canvas, video { background: #000; border-radius: 8px; width: 100%; height: 340px; object-fit: contain; }
        .btn { background: #38bdf8; color: #040711; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; }
        textarea { width: 100%; height: 160px; background: #040711; border: 1px solid #334155; color: #00e676; font-family: monospace; padding: 10px; border-radius: 6px; font-size: 10px; margin-bottom: 10px; word-break: break-all; spellcheck: false; }
        .file-label { background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid #00e676; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-block; }
        .progress-bar { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: #00e676; width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【A站 · 256 页高密原视频 Pop-Stack 编码器】原视频 256 页高密全体素编码 <span class="badge">Station A (High-Density)</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="decoder.html" style="color:#00e676; text-decoration:none; margin-left:15px; font-weight:bold;">前往 B 站解码 ➔</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h3>🎞️ 原视频全体素视界 (高密扫描原视频 256 帧/页全体素)</h3>
            <div style="margin-bottom: 15px; display:flex; gap:10px; align-items:center;">
                <input type="file" id="localVideoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(event)">
                <label for="localVideoInput" class="file-label">📁 选择本地 MP4 视频文件 (如 200MB+ 大视频)</label>
                <span id="fileNameDisplay" style="font-size:12px; color:#94a3b8;">未选择视频 (请选择本地 MP4)</span>
            </div>

            <video id="sourceVideo" controls loop playsinline style="display:none;"></video>
            <canvas id="scanCanvas" width="256" height="256" style="display:none;"></canvas>
            
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <p id="statusMsg" style="font-size:12px; color:#38bdf8; margin-top:8px;">等待选择视频...</p>
        </div>

        <div class="card">
            <h3>📤 256 页高密 Pop-Stack 完整码流包 (数 MB 级别海量流)</h3>
            <textarea id="streamOutputText" readonly placeholder="选择 MP4 后，将在此高密提取原视频 256 页全体素像素阵列，生成包含数 MB 信息的完整 Base64 码流..."></textarea>
            <button class="btn" style="width:100%; margin-top:10px;" onclick="copyStreamData()">📋 复制 256 页高密 Pop-Stack 码流 (去 B 站解码)</button>
            <span id="copyMsg" style="font-size:12px; color:#00e676; display:block; margin-top:8px;"></span>
        </div>
    </div>

    <script>
        let videoEl, scanCanvas, scanCtx;

        document.addEventListener("DOMContentLoaded", () => {
            videoEl = document.getElementById("sourceVideo");
            scanCanvas = document.getElementById("scanCanvas");
            scanCtx = scanCanvas.getContext("2d");
        });

        function handleFileSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;

            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            document.getElementById("fileNameDisplay").innerText = `已选择: ${file.name} (${sizeMB} MB)`;
            document.getElementById("fileNameDisplay").style.color = "#00e676";
            
            videoEl.src = URL.createObjectURL(file);
            videoEl.style.display = "block";

            extractHighDensity256Pages(videoEl);
        }

        // 高密全量抽取 256 页全体素 Pop-Stack 矩阵 (单帧不设上限，生成数 MB 级别海量码流)
        function extractHighDensity256Pages(vEl) {
            document.getElementById("statusMsg").innerText = "⏳ 正在高密全量抓取原视频 256 页全体素像素阵列...";
            
            const totalFrames = 256;
            const streamBytes = [];
            let currentFrame = 0;

            vEl.pause();
            vEl.currentTime = 0;

            function processFrame() {
                scanCtx.drawImage(vEl, 0, 0, 256, 256);
                const imgData = scanCtx.getImageData(0, 0, 256, 256).data;

                // 256x256 全量高密像素点阵采样 (步长 4px, 每页采样 4,096 个高密点)
                const pts = [];
                for (let y = 0; y < 256; y += 4) {
                    for (let x = 0; x < 256; x += 4) {
                        const idx = (y * 256 + x) * 4;
                        pts.push({
                            x: x - 128,
                            y: y - 128,
                            r: imgData[idx],
                            g: imgData[idx + 1],
                            b: imgData[idx + 2]
                        });
                    }
                }

                // 写入包头 (0x54) + 2 字节点数 (4,096 点)
                streamBytes.push(0x54);
                streamBytes.push((currentFrame >> 8) & 0xFF);
                streamBytes.push(currentFrame & 0xFF);
                streamBytes.push((pts.length >> 8) & 0xFF);
                streamBytes.push(pts.length & 0xFF);

                for (let pt of pts) {
                    streamBytes.push((pt.x + 128) & 0xFF);
                    streamBytes.push((pt.y + 128) & 0xFF);
                    streamBytes.push(pt.r);
                    streamBytes.push(pt.g);
                    streamBytes.push(pt.b);
                    streamBytes.push(currentFrame & 0xFF);
                }

                currentFrame++;
                const progressPct = Math.round((currentFrame / totalFrames) * 100);
                document.getElementById("progressFill").style.width = progressPct + "%";
                document.getElementById("statusMsg").innerText = `⏳ 正在高密全量提取原视频 Pop-Stack: 已完成 ${currentFrame} / ${totalFrames} 页 (${progressPct}%)，已生成 ${(streamBytes.length/1024).toFixed(0)} KB 数据...`;

                if (currentFrame < totalFrames) {
                    // 使用 Canvas ImageData 模拟步进
                    vEl.currentTime = (currentFrame / totalFrames) * vEl.duration;
                } else {
                    finishHighDensityEncoding(streamBytes);
                }
            }

            // 同步快速高密步进
            function runFastLoop() {
                if (currentFrame < totalFrames) {
                    processFrame();
                    setTimeout(runFastLoop, 15);
                }
            }
            runFastLoop();
        }

        function finishHighDensityEncoding(bytes) {
            const uint8 = new Uint8Array(bytes);
            let binary = "";
            const chunkSize = 0x8000;
            for (let i = 0; i < uint8.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, uint8.subarray(i, i + chunkSize));
            }
            const b64 = btoa(binary);

            const mbSize = (uint8.length / (1024 * 1024)).toFixed(2);
            document.getElementById("streamOutputText").value = b64;
            document.getElementById("statusMsg").innerText = `✅ 256 页高密 Pop-Stack 编码完成！生成海量码流大小: ${uint8.length.toLocaleString()} 字节 (${mbSize} MB)， Base64 长度 ${b64.length.toLocaleString()} 字符！`;
            document.getElementById("statusMsg").style.color = "#00e676";
        }

        function copyStreamData() {
            const txt = document.getElementById("streamOutputText").value;
            if (!txt) {
                document.getElementById("copyMsg").innerText = "⚠️ 请先导入 MP4 视频等待高密全量编码完成！";
                return;
            }
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById("copyMsg").innerText = "✅ 256 页高密 Pop-Stack 海量码流已复制！可在 B 站精准解算复原！";
                setTimeout(() => document.getElementById("copyMsg").innerText = "", 3000);
            });
        }
    </script>
</body>
</html>
