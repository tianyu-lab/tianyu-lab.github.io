<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【A站 · 编码器】天予 3T 实拍 4K 视频编码工作站 (Encoder Station A)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #040711; color: #e2e8f0; line-height: 1.5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .badge { background: #38bdf8; color: #040711; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 450px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { color: #38bdf8; font-size: 16px; margin-bottom: 15px; }
        canvas { background: #000; border-radius: 8px; width: 100%; height: 340px; }
        .btn { background: #38bdf8; color: #040711; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; }
        textarea { width: 100%; height: 100px; background: #040711; border: 1px solid #334155; color: #00e676; font-family: monospace; padding: 10px; border-radius: 6px; font-size: 10px; margin-bottom: 10px; word-break: break-all; }
        .file-label { background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid #00e676; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ 【A站 · 编码器】天予 3T 4K 视频与矢量编码工作站 <span class="badge">Site A (Encoder Station)</span></div>
        <div>
            <a href="index.html" style="color:#94a3b8; text-decoration:none; margin-left:15px;">首页</a>
            <a href="decoder.html" style="color:#00e676; text-decoration:none; margin-left:15px; font-weight:bold;">前往 B 站解码 ➔</a>
        </div>
    </div>

    <div class="container">
        <!-- 左侧: MP4 视频选择与 Canvas 渲染画幅 -->
        <div class="card">
            <h3>🎞️ 视频输入画幅 (支持选择本地 MP4 / 预设 4K 视频)</h3>
            <div style="margin-bottom: 12px; display:flex; gap:10px; align-items:center;">
                <input type="file" id="localVideoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(event)">
                <label for="localVideoInput" class="file-label">📁 选择本地 MP4 视频文件</label>
                <span id="fileNameDisplay" style="font-size:12px; color:#38bdf8;">已预载: 4K 实拍《老人散步》</span>
            </div>
            <video id="sourceVideo" width="450" height="340" loop muted playsinline style="display:none;"></video>
            <canvas id="encoderCanvas" width="450" height="340"></canvas>
        </div>

        <!-- 右侧: 3T 码流生成与复制 -->
        <div class="card">
            <h3>📤 512 字节 3T 轨迹 Stack 极速编码输出</h3>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:10px;">通过 256 跨度极值切片，将视频帧精准编码为 Pop-Stack 码流包 (217:1 物理压缩)：</p>
            <textarea id="streamOutputText" readonly></textarea>
            <button class="btn" style="width:100%; margin-top:10px;" onclick="copyStreamData()">📋 复制 3T 视频码流包 (去 B 站解码解算)</button>
            <span id="copyMsg" style="font-size:12px; color:#00e676; display:block; margin-top:8px;"></span>
        </div>
    </div>

    <script src="tianyu_geometry_engine.js"></script>
    <script>
        let ctx, videoEl, canvasEl;
        let laorenB64 = "";

        document.addEventListener("DOMContentLoaded", async () => {
            canvasEl = document.getElementById("encoderCanvas");
            ctx = canvasEl.getContext("2d");
            videoEl = document.getElementById("sourceVideo");

            try {
                const res = await fetch("laoren_3t_b64.txt");
                laorenB64 = (await res.text()).trim();
                document.getElementById("streamOutputText").value = laorenB64;
                renderStreamPreview(laorenB64);
            } catch(e) {
                console.log("Preload error:", e);
            }
        });

        function handleFileSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            document.getElementById("fileNameDisplay").innerText = "已选择: " + file.name;
            videoEl.src = URL.createObjectURL(file);
            videoEl.style.display = "block";
            canvasEl.style.display = "none";
            videoEl.play();
        }

        function renderStreamPreview(b64) {
            try {
                const binary = atob(b64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const engine = new window.TianyuPopStackEngine();
                const frame1 = engine.popExtremaStack(bytes.subarray(0, 512));

                const w = canvasEl.width, h = canvasEl.height;
                const cx = w/2, cy = h/2;
                ctx.fillStyle = "#040711"; ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.2;
                ctx.fillStyle = "rgba(56, 189, 248, 0.15)";
                ctx.beginPath();
                for (let i = 0; i < frame1.length; i++) {
                    const pt = frame1[i];
                    if (i === 0) ctx.moveTo(cx + pt.x, cy + pt.y); else ctx.lineTo(cx + pt.x, cy + pt.y);
                }
                ctx.closePath(); ctx.stroke(); ctx.fill();

                for (let pt of frame1) {
                    ctx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
                    ctx.beginPath(); ctx.arc(cx + pt.x, cy + pt.y, 3.5, 0, Math.PI * 2); ctx.fill();
                }
            } catch(e) {}
        }

        function copyStreamData() {
            const txt = document.getElementById("streamOutputText").value;
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById("copyMsg").innerText = "✅ 3T 视频码流已复制！可在 B 站解算复原！";
                setTimeout(() => document.getElementById("copyMsg").innerText = "", 3000);
            });
        }
    </script>
</body>
</html>
